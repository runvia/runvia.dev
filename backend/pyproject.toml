[project]
name = "runvia-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "itsdangerous>=2.1.2",
    "bcrypt>=5",
    "psycopg2-binary>=2.9.12",
    "python-decouple>=3.8",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.32",
    "sqladmin>=0.31.0",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.1",
    "wtforms>=3.2.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.5",
]

[tool.ruff]
extend-exclude = [
    "alembic/versions/",
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Ignore RUF012 (Mutable default value for class attribute) in main.py 
# SQLAdmin reads these lists as configuration and never changes them, so the shared-list problem can’t happen
"app/main.py" = ["RUF012"]
